name: Maxinet Flota Ultima Renta Sync

on:
  schedule:
    # 8:00 AM hora Ciudad de México (UTC-6, sin horario de verano desde 2022), una vez al día. GitHub no garantiza la
    # hora de los cron (llega con horas de retraso): el disparo puntual es el workflow_dispatch que lanza el Apps
    # Script Vigilante_Maxinet a las 8:00. La consulta tarda unos 30 segundos y la corrida completa menos de 2 minutos.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: maxinet-flota-ultima-renta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automations/maxinet-flota-ultima-renta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-flota-ultima-renta/google-creds.json
          SPREADSHEET_ID_SECUNDARIO: ${{ secrets.SPREADSHEET_ID_SECUNDARIO }}
          WORKSHEET_FLOTA_ULTIMA_RENTA: ${{ secrets.WORKSHEET_FLOTA_ULTIMA_RENTA }}
        run: python maxinet_flota_ultima_renta.py
