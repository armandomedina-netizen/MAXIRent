name: Maxinet Sync

# La etiqueta del título (completo | proyeccion-mtto) permite al Apps Script de
# disparo diario saber qué ventana ya corrió: la API de runs no expone el input.
run-name: Maxinet Sync - ${{ (github.event.schedule == '10 14 * * *' || inputs.modo == 'solo_proyeccion_mtto') && 'proyeccion-mtto' || 'completo' }}

on:
  schedule:
    # 8:00 AM hora Ciudad de México (UTC-6, sin horario de verano desde 2022).
    # Maxinet cierra la foto de flota del día anterior de madrugada (entre las
    # 7:00 y las 7:30; el último mensaje de GPS de cada foto cae a las 06:27 del
    # día siguiente), así que a las 8:00 ya está lista. Ver ADR 0003.
    - cron: "0 14 * * *"
    # 8:10 AM -- solo "Proyección de Mantenimientos", 10 minutos después del
    # sync completo. El % de cada día sale del histórico que Maxinet publica
    # después de su corte, así que la hora exacta ya no afecta al valor.
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = sync de las 8:00; solo_proyeccion_mtto = captura de las 8:10"
        type: choice
        options:
          - completo
          - solo_proyeccion_mtto
        default: completo

# Una corrida a la vez por modo: las salvaguardas del script (revisar y luego
# actuar) no son atómicas, así que dos syncs completos simultáneos podrían
# pegar fórmulas sobre una columna ya congelada. Los modos van en grupos
# distintos para que una captura de Proyección en cola no desplace a un sync
# completo en cola (GitHub conserva una sola corrida pendiente por grupo).
concurrency:
  group: maxinet-sync-${{ (github.event.schedule == '10 14 * * *' || inputs.modo == 'solo_proyeccion_mtto') && 'proyeccion-mtto' || 'completo' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automations/maxinet-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-sync/google-creds.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
          SPREADSHEET_ID_SECUNDARIO: ${{ secrets.SPREADSHEET_ID_SECUNDARIO }}
          SPREADSHEET_ID_QUERY: ${{ secrets.SPREADSHEET_ID_QUERY }}
          WORKSHEET_TARIFA_DETALLE: ${{ secrets.WORKSHEET_TARIFA_DETALLE }}
          WORKSHEET_FLOTA_LP: ${{ secrets.WORKSHEET_FLOTA_LP }}
          WORKSHEET_UTILIZACION: ${{ secrets.WORKSHEET_UTILIZACION }}
          WORKSHEET_GRUPO_AUTOS: ${{ secrets.WORKSHEET_GRUPO_AUTOS }}
          EVENTO_SCHEDULE: ${{ github.event.schedule }}
          MODO: ${{ inputs.modo }}
        # El cron de las 8:10 am ("10 14 * * *") o un disparo manual con
        # modo = solo_proyeccion_mtto solo actualizan "Proyección de
        # Mantenimientos"; el de las 8:00 am (y un disparo manual completo)
        # corren el sync completo de siempre.
        run: |
          if [ "$EVENTO_SCHEDULE" = "10 14 * * *" ] || [ "$MODO" = "solo_proyeccion_mtto" ]; then
            python maxinet_sync.py --solo-proyeccion-mtto
          else
            python maxinet_sync.py
          fi
