name: Maxinet Mtto Taller Sync

on:
  schedule:
    # 8:45 AM hora Ciudad de México (UTC-6, sin horario de verano desde 2022), una vez al día. Es el respaldo del disparo
    # del Vigilante (ventana por agregar): el reloj de GitHub llega con horas de retraso. La consulta de Maxinet tarda
    # ~10 segundos y la corrida completa un par de minutos.
    - cron: "45 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Corrida en seco: descarga y compara, pero no escribe nada en el Sheet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maxinet-mtto-taller
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automations/maxinet-mtto-taller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-mtto-taller/google-creds.json
          SPREADSHEET_ID_MTTO_TALLER: ${{ secrets.SPREADSHEET_ID_MTTO_TALLER }}
          WORKSHEET_MTTO_TALLER: ${{ secrets.WORKSHEET_MTTO_TALLER }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python maxinet_mtto_taller.py
