name: Maxinet Ordenes Mtto Sync

on:
  schedule:
    # De 8:30 AM a 5:30 PM hora Ciudad de México (UTC-6, sin horario de verano desde 2022), cada hora al :30.
    # La corrida de las 8:30 es la del Vigilante; el reloj de GitHub mantiene al día los estatus de las órdenes durante el día.
    - cron: "30 14-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: maxinet-mtto-ordenes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automations/maxinet-mtto-ordenes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-mtto-ordenes/google-creds.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_MTTO_ORDENES: ${{ secrets.WORKSHEET_MTTO_ORDENES }}
        run: python maxinet_mtto_ordenes.py
