name: Maxinet Bitácora CP Sync

on:
  schedule:
    # 8:30 AM hora Ciudad de México (UTC-6, sin horario de verano desde 2022): el reporte ya cubre el día anterior completo
    - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: maxinet-bitacora-cp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automations/maxinet-bitacora-cp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-bitacora-cp/google-creds.json
          SPREADSHEET_ID_TABLERO_CP: ${{ secrets.SPREADSHEET_ID_TABLERO_CP }}
          WORKSHEET_BITACORA_NAME: ${{ secrets.WORKSHEET_BITACORA_NAME }}
        run: python maxinet_bitacora_cp.py
