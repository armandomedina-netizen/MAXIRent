name: Gestoria LP & CP Sync

on:
  schedule:
    # Respaldo: 8:45, 12:45 y 16:45 hora Ciudad de México (UTC-6, sin horario
    # de verano desde 2022). GitHub no garantiza la hora de los cron; el
    # disparo puntual (cada hora en horario laboral) es el workflow_dispatch
    # que lanza el Apps Script (automations/automatización Gestoría/apps-script).
    - cron: "45 14,18,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: gestoria-lp-cp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "automations/automatización Gestoría"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/automatización Gestoría/google-creds.json
          SPREADSHEET_ID_GESTORIA: ${{ secrets.SPREADSHEET_ID_GESTORIA }}
          WORKSHEET_GESTORIA_NAME: ${{ secrets.WORKSHEET_GESTORIA_NAME }}
        run: python gestoria_lp_cp_sync.py
