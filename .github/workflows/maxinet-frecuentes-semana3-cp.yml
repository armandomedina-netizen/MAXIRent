name: Maxinet Frecuentes Semana 3 CP Sync

on:
  schedule:
    # 8:15 AM hora Ciudad de México (UTC-6, sin horario de verano desde 2022): revisión diaria. Casi todos los días sólo mira el
    # selector de Maxinet y termina; el día que aparece la semana 3 del mes (tercer sábado) la descarga (~2 min) y la congela
    - cron: "15 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: maxinet-frecuentes-semana3-cp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: automations/maxinet-frecuentes-activos-cp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-frecuentes-activos-cp/google-creds.json
          SPREADSHEET_ID_CLIENTES_NUEVOS: ${{ secrets.SPREADSHEET_ID_CLIENTES_NUEVOS }}
          SEMANA_DEL_MES: "3"
          # nombre o gid de la pestaña "Clientes frecuentes Semana 3"; sin el secret usa ese nombre, nunca la pestaña normal
          WORKSHEET_FRECUENTES_NAME: ${{ secrets.WORKSHEET_FRECUENTES_SEMANA3_NAME }}
        run: python maxinet_frecuentes_activos_cp.py
