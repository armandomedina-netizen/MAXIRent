name: Maxinet Query Sync

on:
  schedule:
    # 8:30 AM hora Ciudad de México (UTC-6, sin horario de verano desde 2022)
    - cron: "30 14 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automations/maxinet-query-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar sincronización
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-query-sync/google-creds.json
          SPREADSHEET_ID_QUERY: ${{ secrets.SPREADSHEET_ID_QUERY }}
          WORKSHEET_QUERY_NAME: ${{ secrets.WORKSHEET_QUERY_NAME }}
        run: python maxinet_query_sync.py
