name: Maxinet Balance

on:
  schedule:
    # Respaldo: minuto 17 de cada hora de 8:00 a 18:00 (hora CDMX, UTC-6).
    # GitHub no garantiza la hora de los cron; el disparo puntual es el
    # workflow_dispatch que lanza el Apps Script.
    - cron: "17 14-23,0 * * *"
  workflow_dispatch:

concurrency:
  group: maxinet-balance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # 15 de la corrida + hasta 40 de espera a Maxinet + 5
    defaults:
      run:
        working-directory: automations/maxinet-balance
    steps:
      - uses: actions/checkout@v4

      - name: Esperar a Maxinet
        uses: ./.github/actions/esperar-maxinet
        with:
          base-url: ${{ secrets.MAXINET_BASE_URL }}
          minutos: "40"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de Google a archivo temporal
        run: echo "$GOOGLE_CREDS_JSON" > google-creds.json
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

      - name: Ejecutar actualización del BALANCE
        env:
          MAXINET_BASE_URL: ${{ secrets.MAXINET_BASE_URL }}
          MAXINET_USER: ${{ secrets.MAXINET_USER }}
          MAXINET_PASS: ${{ secrets.MAXINET_PASS }}
          GOOGLE_CREDS_PATH: ${{ github.workspace }}/automations/maxinet-balance/google-creds.json
          SPREADSHEET_ID_BALANCE: ${{ secrets.SPREADSHEET_ID_BALANCE }}
          SPREADSHEET_ID_QUERY: ${{ secrets.SPREADSHEET_ID_QUERY }}
          WORKSHEET_QUERY_NAME: ${{ secrets.WORKSHEET_QUERY_NAME }}
          # Opcional (variable del repositorio, no secret); vacío = 7 días.
          SOLICITUDES_DIAS_FUTUROS: ${{ vars.SOLICITUDES_DIAS_FUTUROS }}
        run: python maxinet_balance.py
